<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" role="img" aria-labelledby="title description">
	<title id="title">HTTY bootstrap and h2c tunnel diagram</title>
	<desc id="description">A command sends a DCS bootstrap to Chimera, then raw terminal input and output carry h2c traffic. Chimera exposes the attached session as a local browser surface.</desc>
	<defs>
		<linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#edf4fb"/>
		</linearGradient>
		<linearGradient id="tunnel" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0" stop-color="#ffad4a"/>
			<stop offset="1" stop-color="#7dd3fc"/>
		</linearGradient>
		<marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
			<path d="M0,0 L7,3.5 L0,7 Z" fill="#1d4f7a"/>
		</marker>
		<marker id="arrow-orange" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
			<path d="M0,0 L7,3.5 L0,7 Z" fill="#ffad4a"/>
		</marker>
		<marker id="arrow-cyan" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
			<path d="M0,0 L7,3.5 L0,7 Z" fill="#7dd3fc"/>
		</marker>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#07111f" flood-opacity="0.14"/>
		</filter>
	</defs>
	
	<rect width="560" height="760" rx="28" fill="#f6f8fb"/>
	
	<g filter="url(#shadow)">
		<rect x="188" y="54" width="300" height="118" rx="18" fill="url(#panel)" stroke="#c7d7e7"/>
		<text x="216" y="98" fill="#13315a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">Command</text>
		<text x="216" y="134" fill="#516074" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">CLI program in a PTY</text>
		
		<rect x="188" y="310" width="300" height="138" rx="18" fill="url(#panel)" stroke="#c7d7e7"/>
		<text x="216" y="354" fill="#13315a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">Chimera</text>
		<text x="216" y="390" fill="#516074" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">Detects HTTY bootstrap</text>
		<text x="216" y="418" fill="#516074" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">and routes h2c traffic</text>
		
		<rect x="188" y="588" width="300" height="118" rx="18" fill="url(#panel)" stroke="#c7d7e7"/>
		<text x="216" y="632" fill="#13315a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="700">Surface</text>
		<text x="216" y="668" fill="#516074" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">Local browser tab view</text>
	</g>
	
	<path d="M338 172 V304" fill="none" stroke="#ffad4a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
	<text x="358" y="220" fill="#6f4b13" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">1. DCS bootstrap</text>
	
	<g>
		<rect x="54" y="54" width="96" height="394" rx="18" fill="#08213a"/>
		<path d="M90 96 V400" fill="none" stroke="#ffad4a" stroke-width="7" stroke-linecap="round"/>
		<path d="M78 398 L90 426 L102 398 Z" fill="#ffad4a"/>
		<path d="M114 406 V102" fill="none" stroke="#7dd3fc" stroke-width="7" stroke-linecap="round"/>
		<path d="M102 104 L114 76 L126 104 Z" fill="#7dd3fc"/>
		<text x="54" y="488" fill="#13315a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">2. Raw terminal I/O</text>
		<text x="54" y="518" fill="#516074" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">carries plaintext h2c</text>
	</g>
	
	<path d="M338 448 V588" fill="none" stroke="#1d4f7a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
	<text x="358" y="526" fill="#1d4f7a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">3. Browser surface</text>
</svg>
